[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/omerbasavul/cadmesh"
authors = ["omerbasavul"]

[workspace.dependencies]
winnow = "0.7"
thiserror = "2"
anyhow = "1"
rayon = "1"
memchr = "2"
rustc-hash = "2"
log = "0.4"

cad-ir = { path = "crates/cad-ir" }
cad-step = { path = "crates/cad-step" }
xt-parser = { path = "crates/xt-parser" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
panic = "unwind"
