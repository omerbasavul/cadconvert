# On a tag, build every runtime, pack the NuGet, and attach the command line
# for each platform to the release.
#
# The package is not pushed automatically. Publishing is irreversible — a
# version on nuget.org cannot be replaced, only delisted — so the artefact is
# built and attached here and the push is a deliberate act with a key.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the package to nuget.org. Irreversible: a version cannot be replaced, only delisted.'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,    lib: libcadconvert_native.so }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, lib: libcadconvert_native.so }
          - { rid: osx-arm64,   os: macos-14,         lib: libcadconvert_native.dylib }
          # Cross-built from Apple Silicon: GitHub's Intel Macs are scarce
          # enough that this job once sat queued for over an hour while
          # every other runtime finished in about one, and the job that
          # packs the package waits on all of them.
          - { rid: osx-x64,     os: macos-14,         lib: libcadconvert_native.dylib }
          - { rid: win-x64,     os: windows-latest,   lib: cadconvert_native.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: cargo test --release --workspace
        working-directory: native
      - name: dotnet build, which builds the native library too
        run: dotnet build CadConvert.slnx -c Release -p:NativeRid=${{ matrix.rid }}
      # osx-x64 is cross-built from Apple Silicon, and cargo writes a
      # cross-build to target/<triple>/release rather than target/release.
      - name: the command line
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release -p cad-cli --target x86_64-apple-darwin
            echo "CARGO_OUT=target/x86_64-apple-darwin/release" >> "$GITHUB_ENV"
          else
            cargo build --release -p cad-cli
            echo "CARGO_OUT=target/release" >> "$GITHUB_ENV"
          fi
      - name: is the staged library the architecture it claims
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # file(1) spells these differently on each platform: Linux says
          # "x86-64" and "ARM aarch64", macOS says "x86_64" and "arm64".
          case "${{ matrix.rid }}" in
            *-x64)   want="x86_64\|x86-64" ;;
            *-arm64) want="arm64\|aarch64" ;;
          esac
          file "runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}"
          file "runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}" | grep -q "$want" \
            || { echo "::error::${{ matrix.rid }} is not $want"; exit 1; }
      - shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "native/$CARGO_OUT/cadconvert.exe" "dist/cadconvert-${{ matrix.rid }}.exe"
          else
            cp "native/$CARGO_OUT/cadconvert" "dist/cadconvert-${{ matrix.rid }}"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: 'runtime-${{ matrix.rid }}', path: 'runtimes/${{ matrix.rid }}/native/*', if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: 'cadconvert-${{ matrix.rid }}', path: 'dist/*', if-no-files-found: error }

  release:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - uses: actions/download-artifact@v4
        with: { pattern: 'runtime-*', path: staged }
      - uses: actions/download-artifact@v4
        with: { pattern: 'cadconvert-*', path: binaries }

      - name: stage the runtimes, and refuse to ship without all five
        run: |
          set -euo pipefail
          want="linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64"
          for rid in $want; do
            if [ ! -d "staged/runtime-$rid" ]; then
              echo "no native library for $rid; the package would fail there at the first call" >&2
              exit 1
            fi
            mkdir -p "runtimes/$rid/native"
            cp staged/runtime-$rid/* "runtimes/$rid/native/"
          done
          echo "all five runtimes staged"

      - name: version the package from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "packing $version"
          dotnet pack src/CadConvert -c Release -o dist \
            -p:Version="$version" -p:BuildNative=false

      # The last gate before a person decides to publish: restore the package
      # that was just built into an application that has never seen it, and
      # convert something with it. Getting the runtimes/ layout wrong produces
      # no error until the first P/Invoke, and a version on nuget.org cannot be
      # taken back.
      - name: restore the package into a fresh app and convert with it
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          dotnet new console -o app --force >/dev/null
          cat > app/nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="DIST" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          sed -i "s|DIST|$GITHUB_WORKSPACE/dist|" app/nuget.config
          cp "$GITHUB_WORKSPACE/native/crates/cad-convert/tests/samples/small.x_t" app/part.x_t
          cat > app/Program.cs <<'CS'
          using CadConvert;
          Console.WriteLine($"native cadconvert {CadConverter.NativeVersion}");
          foreach (var target in new[] { "out.glb", "out.usdz" })
          {
              var r = CadConverter.Convert("part.x_t", target);
              if (r.Triangles == 0) { Console.Error.WriteLine($"{target} came out empty"); return 1; }
              Console.WriteLine($"{target}: {r.Triangles} triangles, {r.Bytes} bytes");
          }
          try { CadConverter.Convert("no-such-file.x_t", "x.glb"); }
          catch (CadConvertException) { return 0; }
          Console.Error.WriteLine("a missing file was not refused");
          return 1;
          CS
          cd app && dotnet add package CadConvert --prerelease >/dev/null
          dotnet run

      - name: attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.nupkg
            dist/*.snupkg
            binaries/*/*
          generate_release_notes: true

      # Only when a person asked for it, in the run they started. A tag does
      # not publish: pushing to nuget.org cannot be undone, and a release that
      # publishes itself the moment a tag lands is a release nobody had the
      # chance to look at.
      - name: push to nuget.org
        if: inputs.publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::publish was asked for but the NUGET_API_KEY secret is not set"
            exit 1
          fi
          dotnet nuget push dist/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
