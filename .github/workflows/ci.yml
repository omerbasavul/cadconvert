# Test on every platform we ship a runtime for, then build those runtimes and
# pack them into one NuGet package.
#
# `dotnet build` builds the Rust side too — see build/Native.targets — so the
# entry point here is the .NET one everywhere except the Rust test run, which
# has no .NET equivalent.
#
# The package is only useful if it carries a native library for the machine it
# lands on, and a machine can only build its own. So the runtimes are built in
# parallel, uploaded, and collected by a single pack job, which is told not to
# rebuild any of them.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning is a defect that has not been read yet. The workspace builds
  # clean; keep it that way.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The gate is what this workspace actually holds itself to: it builds
      # with no compiler warnings — examples included, since that is where the
      # measuring tools live — and every test passes.
      - name: build, warnings and all
        run: cargo build --release --workspace --all-targets
      - name: cargo test
        run: cargo test --release --workspace

      # rustfmt and clippy are read, not obeyed. The codebase predates both as
      # gates — 511 formatting differences and 41 lints — and reformatting it
      # wholesale would bury every real change in noise. Shown so they can be
      # worked down deliberately, and not allowed to fail the build until they
      # are.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: clippy (advisory)
        continue-on-error: true
        run: cargo clippy --release --workspace --all-targets -- -W clippy::all

  native:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,    lib: libcadconvert_native.so }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, lib: libcadconvert_native.so }
          - { rid: osx-arm64,   os: macos-14,         lib: libcadconvert_native.dylib }
          # Cross-built from Apple Silicon: GitHub's Intel Macs are scarce
          # enough that this job once sat queued for over an hour while
          # every other runtime finished in about one, and the job that
          # packs the package waits on all of them.
          - { rid: osx-x64,     os: macos-14,         lib: libcadconvert_native.dylib }
          - { rid: win-x64,     os: windows-latest,   lib: cadconvert_native.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # This is the whole point of the .NET-first layout: one command, and the
      # native library is built and staged where the package expects it.
      # `NativeRid` is passed so the workflow and MSBuild agree on the name.
      - name: dotnet build (which builds the native library)
        run: dotnet build CadConvert.slnx -c Release -p:NativeRid=${{ matrix.rid }}

      # The Rust tests above cover the readers and the tessellator. These cover
      # the crossing: that the library loads at all from where it was staged,
      # that a non-ASCII path survives the marshalling, that every error code
      # arrives as itself, and that a malformed part comes back as an exception
      # rather than a panic through the ABI. That last one is the reason this
      # runs on every runtime rather than just one — unwinding is where
      # platforms differ.
      # A cross-build that quietly produced the host's architecture would be
      # staged under the right directory name, packed, shipped, and fail at the
      # first P/Invoke on the machine it was meant for. Nothing else in the
      # build would notice, so the file itself is asked.
      - name: is the staged library the architecture it claims
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          file "runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}"
          # file(1) spells these differently on each platform: Linux says
          # "x86-64" and "ARM aarch64", macOS says "x86_64" and "arm64".
          case "${{ matrix.rid }}" in
            *-x64)   want="x86_64\|x86-64" ;;
            *-arm64) want="arm64\|aarch64" ;;
          esac
          file "runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}" | grep -q "$want" \
            || { echo "::error::${{ matrix.rid }} is not $want"; exit 1; }

      # Only where the library can actually be loaded. osx-x64 is cross-built
      # from Apple Silicon and the test host there cannot run it; the same
      # library is exercised natively by the osx-arm64 job, and by every
      # consumer of the package on an Intel Mac.
      - name: dotnet test
        if: matrix.rid != 'osx-x64'
        run: dotnet test CadConvert.slnx -c Release --no-build -p:NativeRid=${{ matrix.rid }}

      - name: the command line, for the release artefacts
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release -p cad-cli --target x86_64-apple-darwin
            echo "CARGO_OUT=target/x86_64-apple-darwin/release" >> "$GITHUB_ENV"
          else
            cargo build --release -p cad-cli
            echo "CARGO_OUT=target/release" >> "$GITHUB_ENV"
          fi

      # The C header is part of the contract, so it is compiled against rather
      # than trusted: a struct that drifts from the Rust side is a caller
      # reading the wrong bytes, and nothing else in the build would notice.
      # macOS ships usdchecker, so the USDZ writer is held to Apple's own
      # reading of the format rather than to ours. --arkit is the stricter
      # pass, the one a package has to survive to open in Quick Look. It
      # caught five real defects the first time it ran, one of them the scale
      # and bias an 8-bit normal map needs in USD and does not in glTF —
      # without which every normal in the file reads as pointing inward.
      - name: usdchecker, including Apple's AR rules
        if: runner.os == 'macOS' && matrix.rid == 'osx-arm64'
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          cargo run --release -q -p cad-export --example usdz_probe -- /tmp/probe.usdz
          usdchecker /tmp/probe.usdz
          usdchecker --arkit /tmp/probe.usdz

      # Skipped where the library cannot run: a cross-built binary links but
      # cannot be executed by this runner.
      - name: compile the C header against the built library (unix)
        if: runner.os != 'Windows' && matrix.rid != 'osx-x64'
        run: |
          cat > /tmp/abi_check.c <<'C'
          #include <stdio.h>
          #include "cadconvert.h"
          int main(void) {
              cadconvert_options o;
              cadconvert_default_options(&o);
              printf("cadconvert %s target=%d twin=%d\n",
                     cadconvert_version(), o.target, o.use_parasolid_twin);
              cadconvert_summary s;
              char *m = NULL;
              int code = cadconvert_convert("no-such-file.x_t", "/tmp/out.glb", &o, &s, &m);
              if (m) { printf("says: %s\n", m); cadconvert_string_free(m); }
              return code == CADCONVERT_OK ? 1 : 0;   /* it must fail, and say why */
          }
          C
          cc -I native/crates/cad-ffi/include -o /tmp/abi_check /tmp/abi_check.c \
             -L "native/$CARGO_OUT" -lcadconvert_native -Wl,-rpath,"$PWD/native/$CARGO_OUT"
          /tmp/abi_check

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

      - name: name the command line for its platform
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "native/$CARGO_OUT/cadconvert.exe" "dist/cadconvert-${{ matrix.rid }}.exe"
          else
            cp "native/$CARGO_OUT/cadconvert" "dist/cadconvert-${{ matrix.rid }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cadconvert-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  pack:
    name: nuget
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: collect every runtime
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: staged

      # `download-artifact` gives one directory per artifact, named after it —
      # `staged/runtime-linux-x64/libcadconvert_native.so`. The package wants
      # `runtimes/linux-x64/native/libcadconvert_native.so`.
      - name: put them where the package looks
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for dir in staged/runtime-*; do
            rid="${dir#staged/runtime-}"
            mkdir -p "runtimes/$rid/native"
            cp "$dir"/* "runtimes/$rid/native/"
            echo "  $rid: $(ls "runtimes/$rid/native")"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "no runtimes arrived; the package would fail at the first P/Invoke" >&2
            exit 1
          fi
          echo "$found runtimes staged"

      # Every runtime is already built and staged, so the native build is off:
      # this machine could only rebuild its own, and would overwrite nothing
      # useful while needing a Rust toolchain to do it.
      - name: pack
        run: dotnet pack src/CadConvert -c Release -o dist -p:BuildNative=false

      # A package that builds is not a package that loads. Restoring it into a
      # fresh app and running it is the only check that the `runtimes/` layout
      # is right — getting it wrong produces no build error at all.
      - name: restore it into a fresh app and call it
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          dotnet new console -o app --force >/dev/null
          cat > app/nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="DIST" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          sed -i "s|DIST|$GITHUB_WORKSPACE/dist|" app/nuget.config
          cat > app/Program.cs <<'CS'
          using CadConvert;
          Console.WriteLine($"native cadconvert {CadConverter.NativeVersion}");
          try { CadConverter.Convert("no-such-file.x_t", "/tmp/out.glb"); }
          catch (CadConvertException e) { Console.WriteLine($"refused as it should: {e.Message}"); return 0; }
          Console.Error.WriteLine("a missing file was not refused");
          return 1;
          CS
          cd app && dotnet add package CadConvert --prerelease >/dev/null
          dotnet run

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/*.nupkg
          if-no-files-found: error
