[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/omerbasavul/cadmesh"
authors = ["omerbasavul"]

[workspace.dependencies]
winnow = "0.7"
thiserror = "2"
anyhow = "1"
rayon = "1"
memchr = "2"
rustc-hash = "2"
log = "0.4"
# Not a performance ornament. The converter frees a body's boundary
# representation — thousands of small blocks — and then asks for a mesh buffer
# of megabytes; the system allocator on macOS cannot put the first inside the
# second, and 42 MB of released memory moved the peak by nothing at all.
# Measured on the pilot: 291 -> 256 MB and 31.4 -> 22.2 s, byte-identical
# output. Binaries only; a library that sets a global allocator decides for
# its callers.
mimalloc = { version = "0.1", default-features = false }

cad-ir = { path = "crates/cad-ir" }
cad-step = { path = "crates/cad-step" }
xt-parser = { path = "crates/xt-parser" }
cad-tess = { path = "crates/cad-tess" }
cad-export = { path = "crates/cad-export" }
cad-convert = { path = "crates/cad-convert" }
cad-xt = { path = "crates/cad-xt" }
cad-gltf = { path = "crates/cad-gltf" }
cad-alloc = { path = "crates/cad-alloc" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding, deliberately. This is a library others embed — a CLI, an FFI
# boundary, a NuGet package — and aborting on a panic takes the host process
# with it. A face whose boundary the triangulator cannot cope with has to
# degrade to a face that failed, which the report already knows how to say.

[profile.bench]
inherits = "release"
